# GitHub Actions pipeline that validates both apps and then triggers the VPS deploy script.
name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          # Use npm ci for reproducible production builds.
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          # Gunicorn is installed here so CI matches the production runtime.
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn

      - name: Validate FastAPI application import
        working-directory: backend
        run: |
          # This catches basic import/runtime issues before the SSH deploy runs.
          python -c "from main import app; print(app.title)"

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/app
            bash deployment/scripts/deploy.sh
